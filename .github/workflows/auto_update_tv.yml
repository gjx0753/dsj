name: 自动更新直播源（无错版）

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 查看仓库文件
        run: |
          echo "=== 仓库文件列表 ==="
          ls -la

      - name: 检查 sources.txt 文件
        run: |
          if [ ! -f sources.txt ]; then
            echo "❌ sources.txt 文件不存在，请在仓库中创建该文件"
            echo "sources.txt 示例格式（每行一个源 URL）："
            echo "  https://example.com/source1.m3u"
            echo "  # 这是注释行，会被忽略"
            echo "  https://example.com/source2.m3u"
            exit 1
          fi
          echo "✅ sources.txt 文件存在"
          echo "=== sources.txt 内容 ==="
          cat sources.txt

      - name: 安装工具
        run: sudo apt-get install -y curl

      - name: 抓取直播源
        run: |
          echo "=== 开始抓取直播源 ==="
          
          # 清空目标文件
          > all_sources.m3u
          
          # 抓取源
          cat sources.txt | grep -v '^#' | grep -v '^$' | while read url; do
            echo "正在抓取: $url"
            curl -sSL --connect-timeout 8 --max-time 15 "$url" | grep -aE '^#EXTINF|^http' >> all_sources.m3u
          done
          
          echo "=== 抓取完成，文件大小: $(wc -c < all_sources.m3u) 字节 ==="

      - name: 去重 + 测速过滤
        run: |
          echo "=== 开始去重和测速 ==="
          
          # 检查 all_sources.m3u 是否有内容
          if [ ! -s all_sources.m3u ]; then
            echo "⚠️ all_sources.m3u 为空，检查 live.m3u 是否存在"
            if [ -f live.m3u ]; then
              echo "保留上次的 live.m3u，不进行更新"
              exit 0
            else
              echo "❌ 上次的 live.m3u 也不存在"
              exit 1
            fi
          fi
          
          echo '#EXTM3U url-tvg="https://epg.112114.xyz/ppm.xml"' > live.m3u
          
          # 计数器
          success_count=0
          total_count=0
          
          cat all_sources.m3u | awk 'NR%2==1{inf=$0}NR%2==0{url=$0;print inf;print url}' | sort -u | while read inf && read url; do
            total_count=$((total_count + 1))
            
            if curl -sf --connect-timeout 3 --max-time 5 -r 0-1000 "$url" >/dev/null 2>&1; then
              echo "$inf" >> live.m3u
              echo "$url" >> live.m3u
              success_count=$((success_count + 1))
              echo "✅ [$success_count] $url"
            else
              echo "❌ 跳过不可用源: $url"
            fi
          done
          
          echo "=== 测速完成 ==="
          echo "live.m3u 大小: $(wc -c < live.m3u) 字节"
          echo "可用频道数: $(grep -c '^#EXTINF' live.m3u)"

      - name: 生成 TVBox 分类接口
        run: |
          cat > tvbox.json << 'EOF'
          {
            "lives": [
              {
                "name": "📺 央视全套",
                "url": "https://raw.githubusercontent.com/bang359/dsj/main/live.m3u#CCTV",
                "epg": "https://epg.112114.xyz/ppm.xml"
              },
              {
                "name": "📡 各省卫视",
                "url": "https://raw.githubusercontent.com/bang359/dsj/main/live.m3u#卫视",
                "epg": "https://epg.112114.xyz/ppm.xml"
              },
              {
                "name": "⚽ 体育频道",
                "url": "https://raw.githubusercontent.com/bang359/dsj/main/live.m3u#体育|CCTV5|咪咕",
                "epg": "https://epg.112114.xyz/ppm.xml"
              },
              {
                "name": "🧸 少儿动漫",
                "url": "https://raw.githubusercontent.com/bang359/dsj/main/live.m3u#少儿|卡通|动漫",
                "epg": "https://epg.112114.xyz/ppm.xml"
              },
              {
                "name": "🎬 影视轮播",
                "url": "https://raw.githubusercontent.com/bang359/dsj/main/live.m3u#电影|轮播|影视",
                "epg": "https://epg.112114.xyz/ppm.xml"
              }
            ]
          }
          EOF
          
          echo "✅ tvbox.json 生成完成"
          cat tvbox.json

      - name: 提交更新
        run: |
          git config --global user.name "bang359"
          git config --global user.email "bang359@users.noreply.github.com"
          
          echo "=== 检查是否有变更 ==="
          git status
          
          git add live.m3u tvbox.json
          git commit -m "✅ 直播源自动更新 $(date +'%Y-%m-%d %H:%M')" || echo "无变更，跳过提交"
          git push
