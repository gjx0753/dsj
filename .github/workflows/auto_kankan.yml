name: 自动抓取看看新闻 + 合并到主直播源

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间晚上8点运行 (UTC 12:00)
    - cron: '0 12 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: 安装 Puppeteer
      run: |
        npm init -y
        npm install puppeteer
    
    - name: 使用 Puppeteer 抓取直播源
      id: fetch_kankan
      run: |
        cat > fetch_m3u8.js << 'EOF'
        const puppeteer = require('puppeteer');
        
        (async () => {
          const browser = await puppeteer.launch({
            headless: 'new',
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });
          
          const page = await browser.newPage();
          await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');
          
          console.log('正在访问页面...');
          await page.goto('https://live.kankanews.com/huikan/', {
            waitUntil: 'networkidle2',
            timeout: 30000
          });
          
          // 等待内容加载
          await page.waitForSelector('video, source, [src*=".m3u8"]', { timeout: 10000 }).catch(() => {
            console.log('未找到 video/source 标签，尝试其他方式...');
          });
          
          // 提取 m3u8 地址
          const m3u8Url = await page.evaluate(() => {
            // 方法1: 查找 video 标签中的 source
            const video = document.querySelector('video');
            if (video) {
              const source = video.querySelector('source[src*=".m3u8"]');
              if (source) return source.src;
              if (video.src && video.src.includes('.m3u8')) return video.src;
            }
            
            // 方法2: 查找所有包含 .m3u8 的元素
            const allElements = document.querySelectorAll('[src*=".m3u8"], [href*=".m3u8"]');
            if (allElements.length > 0) {
              return allElements[0].src || allElements[0].href;
            }
            
            // 方法3: 在页面 HTML 中查找
            const html = document.documentElement.innerHTML;
            const match = html.match(/https?:\/\/[^"'\s<>]+\.m3u8[^"'\s<>]*/);
            return match ? match[0] : null;
          });
          
          await browser.close();
          
          if (m3u8Url) {
            console.log('找到 m3u8:', m3u8Url);
            require('fs').writeFileSync('m3u8_url.txt', m3u8Url);
            
            // 创建 M3U 条目
            const m3uContent = `#EXTINF:-1 tvg-logo="https://live.kankanews.com/html5/images/logo.png",看看新闻\n${m3u8Url}\n`;
            require('fs').writeFileSync('kankan_temp.m3u', m3uContent);
            
            // 输出到 GitHub Actions
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, `m3u8_url=${m3u8Url}\n`);
          } else {
            console.error('未找到 m3u8 地址');
            process.exit(1);
          }
        })();
        EOF
        
        node fetch_m3u8.js
    
    - name: 合并到主直播源 live.m3u
      run: |
        echo "=== 检查 live.m3u 文件 ==="
        
        # 如果 live.m3u 不存在，创建基础结构
        if [ ! -f live.m3u ]; then
          echo "live.m3u 不存在，创建新文件"
          echo "#EXTM3U url-tvg=\"https://epg.112114.xyz/ppm.xml\"" > live.m3u
        fi
        
        if [ ! -f kankan_temp.m3u ]; then
          echo "❌ kankan_temp.m3u 不存在"
          exit 1
        fi
        
        # 备份原文件
        cp live.m3u live.m3u.backup 2>/dev/null || true
        
        # 删除旧的看看新闻条目（包括下一行的 URL）
        sed -i '/#EXTINF:.*看看新闻/,+1d' live.m3u
        
        # 追加新条目
        cat kankan_temp.m3u >> live.m3u
        
        echo "✅ 合并完成"
        echo "=== live.m3u 最后 10 行 ==="
        tail -10 live.m3u
    
    - name: 上传调试文件
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-files
        path: |
          m3u8_url.txt
          kankan_temp.m3u
          live.m3u.backup
          fetch_m3u8.js
        retention-days: 7
    
    - name: Commit and push
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        
        # 检查是否有更改
        if git diff --quiet && git diff --staged --quiet; then
          echo "✅ 无更改，跳过提交"
          exit 0
        fi
        
        git add .
        git commit -m "自动更新看看新闻直播源 [skip ci]"
        git push
        
        echo "✅ 已推送到远程仓库"
