name: 自动抓取看看新闻 + 合并到主直播源

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间晚上8点运行
      - cron: '0 12 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: 查看仓库文件
      run: |
        echo "=== 仓库根目录文件列表 ==="
        ls -la
    
    - name: 安装工具
      run: |
        sudo apt-get update
        sudo apt-get install -y curl dnsutils
    
    - name: 测试网络连接
      run: |
        echo "测试 DNS 解析..."
        nslookup live.kankanews.com || echo "⚠️ DNS 解析失败"
        
        echo "测试 HTTPS 连接..."
        curl -I -s --max-time 10 "https://live.kankanews.com/huikan/" || echo "⚠️ HTTPS 连接失败"
    
    - name: 抓取最新看看新闻直播源
      id: fetch_kankan
      run: |
        set -x
        set -e
        
        URL="https://live.kankanews.com/huikan/"
        echo "正在抓取看看新闻直播源..."
        
        # 保存网页内容
        curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "$URL" > kankan_page.html
        echo "网页大小: $(wc -c < kankan_page.html) 字节"
        
        # 如果网页太小，说明抓取失败
        if [ $(wc -c < kankan_page.html) -lt 100 ]; then
          echo "❌ 网页内容过小，抓取可能失败"
          echo "网页内容:"
          cat kankan_page.html
          exit 1
        fi
        
        # 尝试多种方式提取 m3u8 地址
        M3U8=$(cat kankan_page.html | grep -oP 'https?://[^"'\'' <>\x60]+\.m3u8[^"'\'' <>\x60]*' | head -1)
        
        if [ -z "$M3U8" ]; then
          echo "方法1失败，尝试方法2..."
          M3U8=$(cat kankan_page.html | grep -oE 'url[" ]*[:=][" ]*["\x27]([^"\x27]+\.m3u8[^"\x27]*)["\x27]' | grep -oE 'https?://[^\s"\x27]+' | head -1)
        fi
        
        if [ -z "$M3U8" ]; then
          echo "方法2失败，尝试方法3..."
          M3U8=$(cat kankan_page.html | grep -i 'm3u8' | grep -oE 'https?://[^"\x27<>[:space:]]+' | head -1)
        fi
        
        echo "最终提取到的 m3u8 地址: $M3U8"
        
        if [ -z "$M3U8" ]; then
          echo "❌ 未能抓取到 m3u8 地址"
          echo "网页前 1000 字符:"
          head -c 1000 kankan_page.html
          exit 1
        fi
        
        echo "✅ 抓取成功: $M3U8"
        echo "m3u8_url=$M3U8" >> $GITHUB_OUTPUT
        
        echo "#EXTINF:-1 tvg-logo=\"https://live.kankanews.com/html5/images/logo.png\",看看新闻" > kankan_temp.m3u
        echo "$M3U8" >> kankan_temp.m3u
        
        echo "$M3U8" > m3u8_url.txt
        ls -la kankan_temp.m3u m3u8_url.txt
    
    - name: 合并到主直播源 live.m3u
      run: |
        echo "=== 检查 live.m3u 文件 ==="
        if [ ! -f live.m3u ]; then
          echo "live.m3u 不存在，创建新文件"
          echo "#EXTM3U url-tvg=\"https://epg.112114.xyz/ppm.xml\"" > live.m3u
        fi
        
        if [ ! -f kankan_temp.m3u ]; then
          echo "❌ kankan_temp.m3u 不存在"
          exit 1
        fi
        
        cp live.m3u live.m3u.backup 2>/dev/null || true
        sed -i '/看看新闻/d' live.m3u
        cat kankan_temp.m3u >> live.m3u
        
        echo "✅ 合并完成"
        tail -20 live.m3u
    
    - name: 上传调试文件
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-files
        path: |
          kankan_page.html
          kankan_temp.m3u
          m3u8_url.txt
        retention-days: 7
    
    - name: Commit and push
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        git add .
        git commit -m "自动更新看看新闻 [skip ci]" || echo "无更改"
        git push
