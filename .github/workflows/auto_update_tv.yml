name: 自动更新直播源（M3U转TXT版）

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 防止超时取消，限制为 60 分钟
    timeout-minutes: 60

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        node-version: '20' 

    - name: 初始化环境
      run: |
        sudo apt-get update
        sudo apt-get install -y curl dos2unix

    # 步骤1: 获取源列表 (可以是 .m3u 或 .txt)
    - name: 获取源文件
      run: |
        echo "开始获取源文件..."
        
        # 如果您的仓库里已经有 sources.txt 或 sources.m3u，可以注释掉下面这行
        # 这里使用示例源（包含 M3U 格式）
        curl -sL "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u" -o sources.txt
        
        # 统计原始行数
        echo "原始文件行数: $(wc -l < sources.txt)"

    # 步骤2: 【核心功能】解析 M3U/TXT 并提取链接
    - name: 解析并提取链接
      run: |
        # 提取以 http 或 https 开头的行
        # 这一行命令会自动过滤掉 M3U 中的 #EXTINF 信息和空行，只保留 URL
        grep -iE '^http' sources.txt > raw_urls.txt
        
        # 去重
        sort -u raw_urls.txt > unique_urls.txt
        
        echo "去重后链接数量: $(wc -l < unique_urls.txt)"
        
        # 【性能优化】限制测速数量，防止超时
        # 只取前 600 个唯一链接进行测速
        head -n 600 unique_urls.txt > check_list.txt

    # 步骤3: 快速测速并生成 live.txt
    - name: 测速并生成 live.txt
      run: |
        echo "开始测速..."
        > live.txt
        
        # 循环读取链接并测试
        # -P 15: 15个并发，避免拥堵
        # -m 3: 3秒超时，慢的源直接丢弃
        cat check_list.txt | xargs -P 15 -I {} sh -c '
          if curl -m 3 -s -o /dev/null -w "%{http_code}" "{}" | grep -q "200"; then
            echo "{}" >> live.txt
          fi
        '
        
        echo "最终可用源数量: $(wc -l < live.txt)"

        # 如果结果为空，保留保底源
        if [ ! -s live.txt ]; then
          echo "未测通，使用保底源"
          head -n 10 check_list.txt > live.txt
        fi

    # 步骤4: 提交更新
    - name: 提交更新
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        # 只添加 live.txt
        git add live.txt
        
        git diff --staged --quiet || git commit -m "Auto update live.txt (M3U Parsed) $(date '+%Y-%m-%d %H:%M:%S')" && git push
